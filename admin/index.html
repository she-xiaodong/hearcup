<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hearcup 管理后台</title>
<style>
  :root{
    --mint:#4FB8A8; --mint-d:#3aa293; --orange:#FF9E80; --lav:#B5A8E0;
    --bg:#FBF7F2; --card:#fff; --text:#2f3a3a; --muted:#8a9a98; --line:#eee5dc;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:var(--bg);color:var(--text)}
  .login-wrap{height:100vh;display:flex;align-items:center;justify-content:center}
  .login-card{background:var(--card);padding:36px 40px;border-radius:18px;box-shadow:0 12px 40px rgba(79,184,168,.18);width:340px}
  .login-card h1{color:var(--mint);font-size:22px;margin-bottom:6px}
  .login-card p{color:var(--muted);font-size:13px;margin-bottom:22px}
  input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:14px;outline:none}
  input:focus,select:focus{border-color:var(--mint)}
  button{cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-size:14px;background:var(--mint);color:#fff;transition:.15s}
  button:hover{background:var(--mint-d)}
  button.ghost{background:#fff;color:var(--mint);border:1px solid var(--mint)}
  button.warn{background:var(--orange)}
  button.sm{padding:6px 12px;font-size:12px}
  .layout{display:flex;min-height:100vh}
  .side{width:210px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:fixed;height:100vh}
  .side .logo{color:var(--mint);font-size:19px;font-weight:700;margin-bottom:26px;padding-left:8px}
  .nav-item{padding:11px 12px;border-radius:10px;margin-bottom:6px;color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center}
  .ico{width:18px;height:18px;margin-right:9px;flex:none;stroke:currentColor;fill:none}
  .logo{display:flex;align-items:center}
  .logo .ico{width:22px;height:22px;margin-right:8px}
  .nav-item.active{background:var(--mint);color:#fff}
  .main{margin-left:210px;flex:1;padding:28px 34px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .topbar h2{font-size:20px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
  .stat .n{font-size:26px;font-weight:700;color:var(--mint)}
  .stat .l{color:var(--muted);font-size:13px;margin-top:6px}
  .panel{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.04);margin-bottom:22px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px}
  .tag.on{background:#e3f5f0;color:var(--mint-d)}
  .tag.off{background:#f1ece6;color:var(--muted)}
  .tag.wait{background:#fff3e6;color:#d98326}
  .tag.pass{background:#e3f5f0;color:var(--mint-d)}
  .tag.rej{background:#fde8e8;color:#c0392b}
  .tag.ban{background:#f1ece6;color:#999}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .field{flex:1;min-width:160px}
  .hidden{display:none}
  .muted{color:var(--muted);font-size:12px}
  svg{max-width:100%}
  .bar{fill:var(--mint)}
  .bar2{fill:var(--lav)}
  .u-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;display:block}
  .u-avatar-ph{width:30px;height:30px;border-radius:50%;background:#e3f5f0;color:var(--mint-d);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#f6faf8}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-box{background:#fff;border-radius:16px;width:760px;max-width:100%;max-height:86vh;overflow:auto;padding:22px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .modal-meta{color:var(--muted);font-size:12px;margin-bottom:16px}
  .modal-box h4{margin:16px 0 8px;font-size:14px;color:var(--text)}
  .modal-box table{font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" style="display:none"></div>

<script>
const API = '';
let TOKEN = localStorage.getItem('hc_token') || '';
let STATE = { view:'dashboard', apps:[], providers:[], calls:[], recharges:[], withdraws:[] };

function authHeader(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }; }
async function api(method, path, body){
  const opt = { method, headers: authHeader() };
  if(body!==undefined) opt.body = JSON.stringify(body);
  const r = await fetch(API+path, opt);
  return await r.json();
}
function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function roleText(r){ return '倾听者'; }
function statusTag(s){
  const m={0:['wait','待审核'],1:['pass','已通过'],2:['rej','已拒绝'],3:['ban','已禁用']};
  const [c,t]=m[s]||['off','未知']; return `<span class="tag ${c}">${t}</span>`;
}
// 扁平风格导航图标（内联 SVG，stroke=currentColor，选中时随文字变白）
function ico(name){
  const s = {
    cup:'<path d="M5 9h11v4a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5V9z"/><path d="M16 10h2.5a2 2 0 0 1 0 4H16"/><path d="M8 3v2M11 3v2"/>',
    dashboard:'<path d="M4 20V4M4 20h16"/><rect x="7.5" y="12" width="3" height="6"/><rect x="12.5" y="8" width="3" height="10"/><rect x="17.5" y="14" width="3" height="4"/>',
    providers:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.7-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.5c2.2.4 3.5 2.2 3.5 5"/>',
    users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 15c2.4.3 3.5 2.4 3.5 5"/>',
    apps:'<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 3.5V7h6V3.5"/><path d="M8.5 12l1.6 1.6L8.5 15M15.5 12l-1.6 1.6L15.5 15"/>',
    orders:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18"/><circle cx="17" cy="14.5" r="1.3"/>',
    withdraws:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M16.5 14.5h2"/>',
    config:'<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>',
    logout:'<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 12h11M16 9l3 3-3 3"/>'
  };
  return `<svg class="ico" viewBox="0 0 24 24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${s[name]||''}</svg>`;
}

function renderLogin(){
  document.getElementById('app').innerHTML = `
  <div class="login-wrap"><div class="login-card">
    <h1>🫖 Hearcup 后台</h1><p>一杯心晴 · 管理控制台</p>
    <input id="u" placeholder="管理员账号" value="admin"/>
    <input id="p" type="password" placeholder="密码" value="admin123"/>
    <button style="width:100%" onclick="doLogin()">登 录</button>
    <p class="muted" style="margin-top:14px">演示账号 admin / admin123（运营 operator / op123456）</p>
  </div></div>`;
}
async function doLogin(){
  const username=document.getElementById('u').value;
  const password=document.getElementById('p').value;
  const d = await api('POST','/api/v1/admin/login',{username,password});
  if(d.code===0){ TOKEN=d.data.token; localStorage.setItem('hc_token',TOKEN); render(); }
  else alert('登录失败：'+d.msg);
}
function render(){
  if(!TOKEN){ renderLogin(); return; }
  document.getElementById('app').innerHTML = `
  <div class="layout">
    <div class="side">
      <div class="logo">${ico('cup')} Hearcup</div>
      <div class="nav-item" data-v="dashboard">${ico('dashboard')}数据看板</div>
      <div class="nav-item" data-v="users">${ico('users')}用户管理</div>
      <div class="nav-item" data-v="providers">${ico('providers')}服务者管理</div>
      <div class="nav-item" data-v="apps">${ico('apps')}入驻审核</div>
      <div class="nav-item" data-v="orders">${ico('orders')}订单财务</div>
      <div class="nav-item" data-v="withdraws">${ico('withdraws')}提现管理</div>
      <div class="nav-item" data-v="config">${ico('config')}费率配置</div>
      <div class="nav-item" onclick="logout()" style="margin-top:30px;color:var(--muted)">${ico('logout')}退出登录</div>
    </div>
    <div class="main" id="main"></div>
  </div>`;
  document.querySelectorAll('.nav-item[data-v]').forEach(n=>{
    n.onclick=()=>{ STATE.view=n.dataset.v; renderMain(); };
  });
  // 默认高亮
  document.querySelector(`.nav-item[data-v="${STATE.view}"]`)?.classList.add('active');
  renderMain();
}
function logout(){ TOKEN=''; localStorage.removeItem('hc_token'); render(); }
async function renderMain(){
  document.querySelectorAll('.nav-item[data-v]').forEach(n=>n.classList.toggle('active', n.dataset.v===STATE.view));
  const m=document.getElementById('main');
  if(STATE.view==='dashboard') m.innerHTML = await viewDashboard();
  else if(STATE.view==='users') m.innerHTML = await viewUsers();
  else if(STATE.view==='providers') m.innerHTML = await viewProviders();
  else if(STATE.view==='apps') m.innerHTML = await viewApps();
  else if(STATE.view==='orders') m.innerHTML = await viewOrders();
  else if(STATE.view==='withdraws') m.innerHTML = await viewWithdraws();
  else if(STATE.view==='config') m.innerHTML = await viewConfig();
}

async function viewDashboard(){
  const d = await api('GET','/api/v1/admin/dashboard');
  const s=d.data; const t=s.trend||[];
  const max=Math.max(1,...t.map(x=>x.calls));
  const bars=t.map(x=>`<g><rect class="bar" x="${t.indexOf(x)*34+10}" y="${100-(x.calls/max)*80}" width="20" height="${(x.calls/max)*80}"></rect><text x="${t.indexOf(x)*34+10}" y="118" font-size="9" fill="#8a9a98">${x.date}</text><text x="${t.indexOf(x)*34+10}" y="${100-(x.calls/max)*80-4}" font-size="9" fill="#3aa293">${x.calls}</text></g>`).join('');
  return `<div class="topbar"><h2>数据看板</h2></div>
  <div class="stats">
    <div class="stat"><div class="n">${s.today_calls}</div><div class="l">今日通话</div></div>
    <div class="stat"><div class="n">¥${s.today_income?.toFixed(2)}</div><div class="l">今日收入</div></div>
    <div class="stat"><div class="n">${s.online_providers}</div><div class="l">在线服务者</div></div>
    <div class="stat"><div class="n">${s.new_users}</div><div class="l">今日新增用户</div></div>
  </div>
  <div class="panel"><h3 style="margin-bottom:12px">近 7 日通话量趋势</h3>
    <svg viewBox="0 0 250 130" width="100%" height="160">${bars}</svg>
  </div>`;
}

function fmtTime(ts){ if(!ts) return '-'; const d=new Date(ts*1000); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function uAvatar(u){
  if(u.avatar) return `<img class="u-avatar" src="${u.avatar}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><span class="u-avatar-ph" style="display:none">${(u.nickname||'?').slice(0,1)}</span>`;
  return `<span class="u-avatar-ph">${(u.nickname||'?').slice(0,1)}</span>`;
}
async function viewUsers(){
  const d=await api('GET','/api/v1/admin/users');
  const list=(d.data&&d.data.list)||[];
  const rows=list.map(u=>`<tr class="clickable" onclick="viewUserDetail(${u.id})">
    <td style="font-weight:600">${u.h_no||'-'}</td>
    <td>${uAvatar(u)}</td>
    <td>${u.nickname||'-'}</td>
    <td>¥${(u.balance||0).toFixed(2)}</td>
    <td>${u.call_count||0}</td>
    <td>¥${(u.total_spent||0).toFixed(2)}</td>
    <td>${u.recharge_count||0}</td>
    <td>¥${(u.total_recharged||0).toFixed(2)}</td>
    <td class="muted">${fmtTime(u.created_at)}</td>
  </tr>`).join('');
  return `<div class="topbar"><h2>用户管理（${d.data?.total??list.length}）</h2></div>
  <div class="panel"><table>
    <thead><tr><th>H号</th><th>头像</th><th>昵称</th><th>余额</th><th>通话次数</th><th>消费总额</th><th>充值次数</th><th>充值总额</th><th>注册时间</th></tr></thead>
    <tbody>${rows||'<tr><td colspan=9 class="muted">暂无用户</td></tr>'}</tbody>
  </table></div>
  <div class="muted" style="padding:0 4px">点击任意行查看该用户的通话 / 充值明细</div>`;
}
async function viewUserDetail(id){
  const d=await api('GET','/api/v1/admin/users/'+id);
  if(d.code!==0){ alert(d.msg||'加载失败'); return; }
  const u=d.data.user, calls=d.data.calls||[], recs=d.data.recharges||[];
  const callRows=calls.map(c=>`<tr><td>${c.provider_name||'-'}</td><td>${c.call_type==1?'语音':'视频'}</td><td>${Math.round((c.duration||0)/60)}分</td><td>¥${(c.amount||0).toFixed(2)}</td><td class="muted">${fmtTime(c.created_at)}</td></tr>`).join('');
  const recRows=recs.map(r=>`<tr><td>${r.order_no||'-'}</td><td>¥${(r.amount||0).toFixed(2)}</td><td>${r.pay_status==1?'<span class="tag pass">已支付</span>':'<span class="tag wait">待支付</span>'}</td><td class="muted">${fmtTime(r.created_at)}</td></tr>`).join('');
  document.getElementById('modal').style.display='block';
  document.getElementById('modal').innerHTML = `
  <div class="modal-mask" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div>${uAvatar(u)} <strong style="margin-left:8px">${u.nickname||'-'}</strong> <span class="tag on">H号 ${u.h_no||'-'}</span></div>
        <button class="ghost sm" onclick="closeModal()">关闭</button>
      </div>
      <div class="modal-meta">余额 ¥${(u.balance||0).toFixed(2)} · 冻结 ¥${(u.frozen||0).toFixed(2)} · 手机 ${u.phone||'-'} · 注册 ${fmtTime(u.created_at)}</div>
      <div class="modal-meta" style="word-break:break-all">openid：${u.openid||'-'}</div>
      <h4>通话记录（${calls.length}）</h4>
      <table><thead><tr><th>服务者</th><th>类型</th><th>时长</th><th>扣费</th><th>时间</th></tr></thead><tbody>${callRows||'<tr><td colspan=5 class="muted">暂无通话</td></tr>'}</tbody></table>
      <h4>充值记录（${recs.length}）</h4>
      <table><thead><tr><th>订单号</th><th>金额</th><th>状态</th><th>时间</th></tr></thead><tbody>${recRows||'<tr><td colspan=4 class="muted">暂无充值</td></tr>'}</tbody></table>
    </div>
  </div>`;
}
function closeModal(){ const m=document.getElementById('modal'); if(m){ m.style.display='none'; m.innerHTML=''; } }

async function viewProviders(){
  const d=await api('GET','/api/v1/admin/providers');
  const list=d.data||[];
  const rows=list.map(p=>`<tr>
    <td>${p.real_name}</td><td>${roleText(p.role)}</td><td>${'★'.repeat(Math.round(p.rating||0))||'-'}</td>
    <td>${p.total_sessions}</td><td>¥${p.total_earnings?.toFixed(2)}</td>
    <td>${p.is_online? '<span class="tag on">在线</span>':'<span class="tag off">离线</span>'}</td>
    <td>${statusTag(p.status)}</td>
    <td>
      ${p.status===1? `<button class="sm ghost" onclick="setOnline(${p.id},${p.is_online?0:1})">${p.is_online?'下线':'上线'}</button>`:''}
      ${p.status===1? `<button class="sm warn" onclick="disable(${p.id})">禁用</button>`:''}
    </td></tr>`).join('');
  return `<div class="topbar"><h2>服务者管理</h2></div>
  <div class="panel"><table><thead><tr><th>姓名</th><th>角色</th><th>评分</th><th>服务次数</th><th>累计收益</th><th>状态</th><th>审核</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function setOnline(id,v){ await api('PUT',`/api/v1/admin/providers/${id}/status`,{is_online:v}); renderMain(); }
async function disable(id){ await api('PUT',`/api/v1/admin/providers/${id}/status`,{status:3}); renderMain(); }

async function viewApps(){
  const d=await api('GET','/api/v1/admin/providers/applications');
  const list=d.data||[];
  if(!list.length) return `<div class="topbar"><h2>入驻审核</h2></div><div class="panel muted">当前没有待审核的申请。</div>`;
  const rows=list.map(p=>`<tr>
    <td>${p.real_name}</td><td>${roleText(p.role)}</td><td>${p.phone}</td>
    <td>${p.intro?.slice(0,20)}…</td>
    <td>${p.certificate_no||'—'}</td>
    <td>
      <button class="sm" onclick="approve(${p.id},true)">通过</button>
      <button class="sm warn" onclick="approve(${p.id},false)">拒绝</button>
    </td></tr>`).join('');
  return `<div class="topbar"><h2>入驻审核（${list.length}）</h2></div>
  <div class="panel"><table><thead><tr><th>姓名</th><th>角色</th><th>手机号</th><th>简介</th><th>证书编号</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function approve(id,ok){
  if(!ok && !confirm('确认拒绝该申请？')) return;
  await api('PUT',`/api/v1/admin/providers/${id}/approve`,{approve:ok, reason: ok?'':'不符合要求'});
  renderMain();
}

async function viewOrders(){
  const c=await api('GET','/api/v1/admin/orders/calls');
  const r=await api('GET','/api/v1/admin/orders/recharge');
  const calls=(c.data||[]).map(x=>`<tr><td>${x.user_name}</td><td>${x.provider_name}</td><td>${x.call_type==1?'语音':'视频'}</td><td>${Math.round(x.duration/60)}分</td><td>¥${x.amount?.toFixed(2)}</td><td>¥${x.provider_income?.toFixed(2)}</td><td>¥${x.platform_fee?.toFixed(2)}</td></tr>`).join('');
  const recs=(r.data||[]).map(x=>`<tr><td>${x.user_name}</td><td>¥${x.amount?.toFixed(2)}</td><td>${x.pay_status==1?'<span class="tag pass">已支付</span>':'待支付'}</td></tr>`).join('');
  return `<div class="topbar"><h2>订单与财务</h2></div>
  <div class="panel"><h3 style="margin-bottom:10px">通话订单</h3><table><thead><tr><th>用户</th><th>服务者</th><th>类型</th><th>时长</th><th>金额</th><th>服务者收入</th><th>平台抽成</th></tr></thead><tbody>${calls}</tbody></table></div>
  <div class="panel"><h3 style="margin-bottom:10px">充值记录</h3><table><thead><tr><th>用户</th><th>金额</th><th>状态</th></tr></thead><tbody>${recs}</tbody></table></div>`;
}

async function viewWithdraws(){
  const d=await api('GET','/api/v1/admin/withdraws');
  const list=d.data||[];
  const rows=list.map(w=>`<tr><td>${w.provider_name}</td><td>¥${w.amount?.toFixed(2)}</td>
    <td>${['待审核','审核通过','已打款','已拒绝'][w.status]||w.status}</td>
    <td>
      <button class="sm" onclick="wd(${w.id},1)">通过</button>
      <button class="sm ghost" onclick="wd(${w.id},2)">打款</button>
      <button class="sm warn" onclick="wd(${w.id},3)">拒绝</button>
    </td></tr>`).join('');
  return `<div class="topbar"><h2>提现管理</h2></div>
  <div class="panel"><table><thead><tr><th>服务者</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan=4 class="muted">暂无提现申请</td></tr>'}</tbody></table></div>`;
}
async function wd(id,st){ await api('PUT',`/api/v1/admin/withdraws/${id}`,{status:st}); renderMain(); }

async function viewConfig(){
  const d=await api('GET','/api/v1/admin/config');
  const c=d.data||{};
  return `<div class="topbar"><h2>费率配置</h2></div>
  <div class="panel"><div class="row">
    <div class="field"><label>倾听师单价(元/分)</label><input id="c1" type="number" step="0.1" value="${c.price_listener??1}"></div>
    <div class="field"><label>咨询师单价(元/分)</label><input id="c2" type="number" step="0.1" value="${c.price_counselor??2}"></div>
    <div class="field"><label>平台抽成(%)</label><input id="c3" type="number" step="0.01" value="${c.platform_rate??0.2}"></div>
    <div class="field"><label>起呼最低余额(元)</label><input id="c4" type="number" step="0.1" value="${c.min_balance??3}"></div>
    <div class="field"><label>透支额度(元)</label><input id="c5" type="number" step="0.1" value="${c.overdraft??2}"></div>
    <div class="field"><label>最低提现(元)</label><input id="c6" type="number" step="1" value="${c.min_withdraw??100}"></div>
  </div>
  <button style="margin-top:16px" onclick="saveConfig()">保存配置</button></div>`;
}
async function saveConfig(){
  const body={
    price_listener:parseFloat(c1.value), price_counselor:parseFloat(c2.value),
    platform_rate:parseFloat(c3.value), min_balance:parseFloat(c4.value),
    overdraft:parseFloat(c5.value), min_withdraw:parseFloat(c6.value)
  };
  await api('PUT','/api/v1/admin/config',body);
  alert('已保存');
}

render();
</script>
</body>
</html>
